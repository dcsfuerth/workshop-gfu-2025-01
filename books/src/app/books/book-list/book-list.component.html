<p>Die Liste unserer Bücher:</p>

<p *ngIf="books.length===0">Es gibt noch keine Bücher</p>

<button (click)="toggleCover()">Cover {{coverIsVisible ? 'aus' : 'ein'}}blenden</button>

@if (books.length>0) {
  <table border="1" style="width: 100%">
    <tr>
      <td>Nr.</td>
      <td>ISBN</td>
      <td>Titel</td>
      <td>Preis</td>
      <td></td>
    </tr>
    <tr *ngFor="let book of books; let i = index; trackBy: trackByBook">
      <td>{{i+1}}</td>
      <td>{{book.isbn}}</td>
      <td>{{book.title}}</td>
      <td [ngClass]="{'on-discount': book.price < 20, 'teuer': book.price >=30}">{{book.price}}</td>
      <td><img *ngIf="coverIsVisible" [src]="book.coverUrl" [style.width.px]="bildBreite"   ></td>
    </tr>
  </table>
}
